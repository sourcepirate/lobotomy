[package]
name = "lobotomy"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "TUI to explore and surgically edit layers of HuggingFace safetensors models"
license = "Apache-2.0"

[[bin]]
name = "lobotomy"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
half = "2"
memmap2 = "0.9"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
ureq = "3"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
